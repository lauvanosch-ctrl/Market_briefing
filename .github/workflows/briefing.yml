name: Daily briefing

on:
  schedule:
    - cron: "05 11 * * 2-6"  # 08:20 UTC, Tue-Sat = 09:20 NL in winter, 10:20 in summer
  workflow_dispatch:        # keep the manual button too

permissions:
  contents: write           # allows this workflow to push the new docs/ commit

concurrency:
  group: briefing           # never two briefing runs at the same time

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15     # a stuck run is stopped instead of burning minutes
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Build the briefing
        run: python briefing.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit the new briefing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Daily briefing $(date -u +%F)"
          git pull --rebase
          git push